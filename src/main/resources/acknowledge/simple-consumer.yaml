spring:
  cloud:
    function:
      definition: consumer
    stream:
      bindings:
        consumer-in-0:
          destination: demo-topic # multiple topics can be specified as comma separated values
          group: demo-group
      kafka:
        binder:
          brokers: localhost:9092
          consumer-properties:
            auto.offset.reset: earliest
        bindings:
          consumer-in-0:
            consumer:
             ack-mode: MANUAL

        
           
  